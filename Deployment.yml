apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: hpa-demo}
  template:
    metadata:
      labels: {app: hpa-demo}
    spec:
      containers:
        - name: app
          image: hpa-demo:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}   # HPA % is calculated against this
            limits:   {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}